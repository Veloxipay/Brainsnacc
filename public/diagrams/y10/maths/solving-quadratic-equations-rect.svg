<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 260" width="410" height="260" role="img"><title>Rectangle with width x m, length x + 4 m and area 60 square metres</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="1" points="90.0,60.0 370.0,60.0 370.0,230.0 90.0,230.0" fill="#EDE9FE" stroke="#1F2937" stroke-width="2" stroke-linejoin="round"/><text data-step="3" x="230.0" y="145.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Area = 60 m²</text><text data-step="2" x="230.0" y="38.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">x + 4</text><text data-step="2" x="76.0" y="145.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">x</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img"><title>Rectangle with width x cm, length x + 2 cm and area 48 square centimetres</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="1" points="90.0,60.0 360.0,60.0 360.0,250.0 90.0,250.0" fill="#EDE9FE" stroke="#1F2937" stroke-width="2" stroke-linejoin="round"/><text data-step="3" x="225.0" y="155.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Area = 48 cm²</text><text data-step="2" x="225.0" y="38.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">x + 2</text><text data-step="2" x="76.0" y="155.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">x</text></svg>
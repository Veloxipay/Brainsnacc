<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 270" width="390" height="270" role="img"><title>Rectangle with width x m, length x + 3 m and area 40 square metres</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="1" points="90.0,60.0 350.0,60.0 350.0,240.0 90.0,240.0" fill="#EDE9FE" stroke="#1F2937" stroke-width="2" stroke-linejoin="round"/><text data-step="3" x="220.0" y="150.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Area = 40 m²</text><text data-step="2" x="220.0" y="38.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">x + 3</text><text data-step="2" x="76.0" y="150.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">x</text></svg>
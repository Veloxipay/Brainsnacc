<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190" width="520" height="190" role="img"><title>Normal hours plus overtime</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="1" points="40.0,72.0 420.0,72.0 420.0,122.0 40.0,122.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><text data-step="2" x="230.0" y="97.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">38 h at $30 = $1140</text><polygon data-step="1" points="420.0,72.0 480.0,72.0 480.0,122.0 420.0,122.0" fill="#A7F3D0" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><text data-step="2" x="450.0" y="97.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">OT</text><line data-step="2" x1="40.0" y1="42.0" x2="40.0" y2="52.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="40.0" y1="52.0" x2="480.0" y2="52.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="480.0" y1="52.0" x2="480.0" y2="42.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><text data-step="2" x="260.0" y="38.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">gross pay = $1140 + $180 = $1320</text><line data-step="2" x1="420.0" y1="152.0" x2="420.0" y2="142.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="420.0" y1="142.0" x2="480.0" y2="142.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="480.0" y1="142.0" x2="480.0" y2="152.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><text data-step="2" x="370.4" y="174.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">overtime: 4 h × $45 = $180</text></svg>
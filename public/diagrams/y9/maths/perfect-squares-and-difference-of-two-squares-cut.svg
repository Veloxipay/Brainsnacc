<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 315" width="370" height="315" role="img"><title>A square of side a with a small square of side b cut from one corner, leaving area a² − b²</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="1" points="90.0,50.0 310.0,50.0 310.0,190.0 230.0,190.0 230.0,270.0 90.0,270.0" fill="#EDE9FE" stroke="#1F2937" stroke-width="2.6" stroke-linejoin="round"/><polygon data-step="1" points="230.0,190.0 310.0,190.0 310.0,270.0 230.0,270.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/><text data-step="2" x="200.0" y="30.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">a</text><text data-step="2" x="72.0" y="160.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">a</text><text data-step="2" x="270.0" y="290.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">b</text><text data-step="2" x="328.0" y="230.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#5B3ED6" text-anchor="start" dominant-baseline="central">b</text><text data-step="3" x="160.0" y="120.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">a² − b²</text><text data-step="3" x="270.0" y="230.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle" dominant-baseline="central">cut out</text></svg>
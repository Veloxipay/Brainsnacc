<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" width="520" height="430" role="img"><title>Flowchart of the halving method</title><rect width="100%" height="100%" fill="#FFFFFF"/><rect data-step="1" x="114.0" y="13.0" width="72.0" height="38.0" rx="19.0" fill="#EDE9FE" stroke="#1F2937" stroke-width="2.2"/><text data-step="1" x="150.0" y="32.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Start</text><rect data-step="1" x="-3.6" y="69.0" width="307.2" height="58.0" rx="4.0" fill="#F5F3FF" stroke="#1F2937" stroke-width="2.2"/><text data-step="1" x="150.0" y="88.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Choose a and b where</text><text data-step="1" x="150.0" y="108.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">f(a) and f(b) have opposite signs</text><rect data-step="1" x="72.0" y="157.0" width="156.0" height="38.0" rx="4.0" fill="#F5F3FF" stroke="#1F2937" stroke-width="2.2"/><text data-step="1" x="150.0" y="176.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">m = (a + b) ÷ 2</text><polygon data-step="1" points="150.0,212.0 240.0,262.0 150.0,312.0 60.0,262.0" fill="#FEF3C7" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text data-step="1" x="150.0" y="252.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">f(m) same sign</text><text data-step="1" x="150.0" y="272.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">as f(a)?</text><rect 
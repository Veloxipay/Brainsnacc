<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" role="img"><title>Prefix staircase</title><rect width="100%" height="100%" fill="#FFFFFF"/><rect data-step="1" x="18" y="14" width="340" height="34" rx="6" fill="#F5F3FF" stroke="#1F2937" stroke-width="1.6"/><text data-step="1" x="32.0" y="37.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="central">Tm</text><text data-step="1" x="78.0" y="37.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start" dominant-baseline="central">tera</text><text data-step="2" x="350.0" y="37.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">1 Tm = 1 000 000 000 000 m</text><rect data-step="1" x="40" y="54" width="340" height="34" rx="6" fill="#F5F3FF" stroke="#1F2937" stroke-width="1.6"/><text data-step="1" x="54.0" y="77.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="central">Gm</text><text data-step="1" x="100.0" y="77.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start" dominant-baseline="central">giga</text><text data-step="2" x="372.0" y="77.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">1 Gm = 1 000 000 000 m</text><rect data-step="1" x="62" y="94" width="340" height="34" rx="6" fill="#F5F3FF" stroke="#1F2937" stroke-width="1.6"/><text data-step="1" x="76.0" y="117.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="central">Mm</text><text data-step="1" x="122.0" y="117.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start" dominant-baseline="central">mega</text><text data-step="2" x="394.0" y="117.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">1 Mm = 1 000 000 m</text><rect data-step="1" x="84" y="134" width="340" height="34" rx="6" fill="#F5F3FF" stroke="#1F2937" stroke-width="1.6"/><text data-step="1" x="98.0" y="157.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="central">km</text><text data-step="1" x="144.0" y="157.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start" dominant-baseline="central">kilo</text><text data-step="2" x="416.0" y="157.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">1 km = 1000 m</text><rect data-step="1" x="106" y="174" width="340" height="34" rx="6" fill="#F5F3FF" stroke="#1F2937" stroke-width="1.6"/><text data-step="1" x="120.0" y="197.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="central">m</text><text data-step="1" x="166.0" y="197.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start" dominant-baseline="central">(base unit)</text><text data-step="2" x="438.0" y="197.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">1 m = 1 m</text><rect data-step="1" x="128" y="214" width="340" height="34" rx="6" fill="#F5F3FF" stroke="#1F2937" stroke-width="1.6"/><text data-step="1" x="142.0" y="237.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="central">mm</text><text data-step="1" x="188.0" y="237.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start" dominant-baseline="central">milli</text><text data-step="2" x="460.0" y="237.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">1 mm = 0.001 m</text><rect data-step="1" x="150" y="254" width="340" height="34" rx="6" fill="#DDD6FE" stroke="#5B3ED6" stroke-width="2.4"/><text data-step="1" x="164.0" y="277.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="central">µm</text><text data-step="1" x="210.0" y="277.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start" dominant-baseline="central">micro</text><text data-step="2" x="482.0" y="277.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">1 µm = 0.000 001 m</text><rect data-step="1" x="172" y="294" width="340" height="34" rx="6" fill="#DDD6FE" stroke="#5B3ED6" stroke-width="2.4"/><text data-step="1" x="186.0" y="317.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="central">nm</text><text data-step="1" x="232.0" y="317.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start" dominant-baseline="central">nano</text><text data-step="2" x="504.0" y="317.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">1 nm = 0.000 000 001 m</text><text data-step="2" x="20.0" y="366.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="start" dominant-baseline="central">Down one stair: × 1000.  Up one stair: ÷ 1000.</text></svg>
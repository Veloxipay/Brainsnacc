.0 290.0,170.0 290.0,220.0 230.0,220.0" fill="#93C5FD" stroke="#1F2937" stroke-width="1.4" stroke-linejoin="round"/><polygon data-step="2" points="290.0,170.0 350.0,170.0 350.0,220.0 290.0,220.0" fill="#93C5FD" stroke="#1F2937" stroke-width="1.4" stroke-linejoin="round"/><polygon data-step="2" points="350.0,170.0 410.0,170.0 410.0,220.0 350.0,220.0" fill="#93C5FD" stroke="#1F2937" stroke-width="1.4" stroke-linejoin="round"/><polygon data-step="1" points="410.0,170.0 470.0,170.0 470.0,220.0 410.0,220.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4" stroke-linejoin="round"/><polygon data-step="1" points="170.0,70.0 470.0,70.0 470.0,220.0 170.0,220.0" fill="none" stroke="#1F2937" stroke-width="2.6" stroke-linejoin="round"/><polyline data-step="3" points="170.0,64.0 170.0,56.0 410.0,56.0 410.0,64.0" fill="none" stroke="#5B3ED6" stroke-width="2.2" stroke-linejoin="round"/><text data-step="3" x="290.0" y="42.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">4/5</text><polyline data-step="3" points="162.0,70.0 154.0,70.0 154.0,170.0 162.0,170.0" fill="none" stroke="#5B3ED6" stroke-width="2.2" stroke-linejoin="round"/><text data-step="3" x="142.0" y="120.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#5B3ED6" text-anchor="end" dominant-baseline="central">2/3</text><text data-step="3" x="320.0" y="256.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">8 of the 15 parts are in both: 2/3 × 4/5 = 8/15</text></svg>
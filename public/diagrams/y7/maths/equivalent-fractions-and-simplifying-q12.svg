<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" role="img"><title>Three quarters of a cup and a one eighth cup scoop</title><rect width="100%" height="100%" fill="#FFFFFF"/><text data-step="1" x="104.0" y="80.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2937" text-anchor="end" dominant-baseline="central">milk</text><polygon data-step="1" points="120.0,57.0 480.0,57.0 480.0,103.0 120.0,103.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.6" stroke-linejoin="round"/><polygon data-step="2" points="120.0,57.0 210.0,57.0 210.0,103.0 120.0,103.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="0" stroke-linejoin="round"/><polygon data-step="2" points="210.0,57.0 300.0,57.0 300.0,103.0 210.0,103.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="0" stroke-linejoin="round"/><polygon data-step="2" points="300.0,57.0 390.0,57.0 390.0,103.0 300.0,103.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="0" stroke-linejoin="round"/><polygon data-step="1" points="120.0,57.0 480.0,57.0 480.0,103.0 120.0,103.0" fill="none" stroke="#1F2937" stroke-width="2.6" stroke-linejoin="round"/><line data-step="1" x1="210.0" y1="57.0" x2="210.0" y2="103.0" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/><line data-step="1" x1="300.0" y1="57.0" x2="300.0" y2="103.0" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/><line data-step="1" x1="390.0" y1="57.0" x2="390.0" y2="103.0" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/><polyline data-step="3" points="120.0,52.0 120.0,44.0 390.0,44.0 390.0,52.0" fill="none" stroke="#5B3ED6" stroke-width="2.2" stroke-linejoin="round"/><text data-step="3" x="255.0" y="30.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">3/4 cup needed</text><text data-step="1" x="300.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle" dominant-baseline="central">1 whole cup</text><text data-step="1" x="104.0" y="200.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2937" text-anchor="end" dominant-baseline="central">scoop</text><polygon data-step="1" points="120.0,177.0 165.0,177.0 165.0,223.0 120.0,223.0" fill="#FDE68A" stroke="#1F2937" stroke-width="2.0" stroke-linejoin="round"/><text data-step="2" x="179.0" y="200.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3ED6" text-anchor="start" dominant-baseline="central">1 scoop = 1/8 cup</text></svg>
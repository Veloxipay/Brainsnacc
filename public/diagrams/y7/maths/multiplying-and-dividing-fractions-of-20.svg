<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" role="img"><title>A 20 kg bar split into 4 parts of 5 kg with 3 parts shaded</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="1" points="90.0,100.0 450.0,100.0 450.0,150.0 90.0,150.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.6" stroke-linejoin="round"/><polygon data-step="2" points="90.0,100.0 180.0,100.0 180.0,150.0 90.0,150.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="0" stroke-linejoin="round"/><polygon data-step="2" points="180.0,100.0 270.0,100.0 270.0,150.0 180.0,150.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="0" stroke-linejoin="round"/><polygon data-step="2" points="270.0,100.0 360.0,100.0 360.0,150.0 270.0,150.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="0" stroke-linejoin="round"/><polygon data-step="1" points="90.0,100.0 450.0,100.0 450.0,150.0 90.0,150.0" fill="none" stroke="#1F2937" stroke-width="2.6" stroke-linejoin="round"/><line data-step="1" x1="180.0" y1="100.0" x2="180.0" y2="150.0" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/><line data-step="1" x1="270.0" y1="100.0" x2="270.0" y2="150.0" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/><line data-step="1" x1="360.0" y1="100.0" x2="360.0" y2="150.0" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/><text data-step="2" x="135.0" y="125.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">5 kg</text><text data-step="2" x="225.0" y="125.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">5 kg</text><text data-step="2" x="315.0" y="125.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">5 kg</text><text data-step="2" x="405.0" y="125.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">5 kg</text><polyline data-step="3" points="90.0,94.0 90.0,86.0 450.0,86.0 450.0,94.0" fill="none" stroke="#5B3ED6" stroke-width="2.2" stroke-linejoin="round"/><text data-step="3" x="270.0" y="72.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">20 kg</text><polyline data-step="3" points="90.0,156.0 90.0,164.0 360.0,164.0 360.0,156.0" fill="none" stroke="#5B3ED6" stroke-width="2.2" stroke-linejoin="round"/><text data-step="3" x="225.0" y="179.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">3/4 of 20 kg = 15 kg</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180" role="img"><title>A bar of 10 equal tenths: 4 tenths spent first, 3 tenths spent next, 3 tenths left = $18</title><rect width="100%" height="100%" fill="#FFFFFF"/><polyline data-step="3" points="268.0,64.0 268.0,56.0 490.0,56.0 490.0,64.0" fill="none" stroke="#5B3ED6" stroke-width="2.2" stroke-linejoin="round"/><text data-step="3" x="379.0" y="40.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">the rest: 3/5 = 6 tenths</text><text data-step="1" x="108.0" y="96.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="end" dominant-baseline="central">start</text><polygon data-step="1" points="120.0,70.0 268.0,70.0 268.0,122.0 120.0,122.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="1.8" stroke-linejoin="round"/><text data-step="2" x="194.0" y="96.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">spent first (2/5)</text><polygon data-step="1" points="268.0,70.0 379.0,70.0 379.0,122.0 268.0,122.0" fill="#EDE9FE" stroke="#1F2937" stroke-width="1.8" stroke-linejoin="round"/><text data-step="2" x="323.5" y="96.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">spent next</text><polygon data-step="1" points="379.0,70.0 490.0,70.0 490.0,122.0 379.0,122.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8" stroke-linejoin="round"/><text data-step="2" x="434.5" y="96.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">$18 left</text><polyline data-step="3" points="120.0,128.0 120.0,136.0 268.0,136.0 268.0,128.0" fill="none" stroke="#5B3ED6" stroke-width="2.2" stroke-linejoin="round"/><text data-step="3" x="194.0" y="152.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">4 tenths</text><polyline data-step="3" points="268.0,128.0 268.0,136.0 379.0,136.0 379.0,128.0" fill="none" stroke="#5B3ED6" stroke-width="2.2" stroke-linejoin="round"/><text data-step="3" x="323.5" y="152.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">3 tenths</text><polyline data-step="3" points="379.0,128.0 379.0,136.0 490.0,136.0 490.0,128.0" fill="none" stroke="#5B3ED6" stroke-width="2.2" stroke-linejoin="round"/><text data-step="3" x="434.5" y="152.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">3 tenths = $18</text></svg>
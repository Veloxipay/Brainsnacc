<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img"><title>Two copies of a trapezium make a parallelogram</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="1" points="58.0,195.0 295.6,195.0 224.4,88.0 105.5,88.0" fill="#F5F3FF" stroke="#1F2937" stroke-width="2.6" stroke-linejoin="round"/><polygon data-step="1" points="295.6,195.0 414.5,195.0 462.0,88.0 224.4,88.0" fill="#DDD6FE" stroke="#1F2937" stroke-width="2.6" stroke-linejoin="round"/><text data-step="2" x="176.8" y="216.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">b</text><text data-step="2" x="355.1" y="216.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">a</text><text data-step="2" x="164.9" y="66.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">a</text><text data-step="2" x="343.2" y="66.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">b</text><line data-step="2" x1="105.5" y1="88.0" x2="105.5" y2="195.0" stroke="#5B3ED6" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6"/><polyline data-step="2" points="119.5,195.0 119.5,181.0 105.5,181.0" fill="none" stroke="#5B3ED6" stroke-width="2.2"/><text data-step="2" x="113.5" y="141.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#5B3ED6" text-anchor="start" dominant-baseline="central">h</text><text data-step="2" x="260.0" y="252.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">base of parallelogram = a + b</text></svg>
7" text-anchor="middle" dominant-baseline="central">then b with r</text><line data-step="1" x1="177.7" y1="57.2" x2="177.7" y2="83.7" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><polygon data-step="1" points="177.7,83.7 181.9,75.1 173.6,75.1" fill="#1F2937" stroke="#1F2937" stroke-width="1" stroke-linejoin="round"/><line data-step="1" x1="177.7" y1="131.5" x2="177.7" y2="163.3" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><polygon data-step="1" points="177.7,163.3 181.9,154.7 173.6,154.7" fill="#1F2937" stroke="#1F2937" stroke-width="1" stroke-linejoin="round"/><line data-step="1" x1="177.7" y1="211.1" x2="177.7" y2="243.0" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><polygon data-step="1" points="177.7,243.0 181.9,234.4 173.6,234.4" fill="#1F2937" stroke="#1F2937" stroke-width="1" stroke-linejoin="round"/><line data-step="1" x1="177.7" y1="312.0" x2="177.7" y2="346.5" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><polygon data-step="1" points="177.7,346.5 181.9,337.9 173.6,337.9" fill="#1F2937" stroke="#1F2937" stroke-width="1" stroke-linejoin="round"/><text data-step="2" x="196.3" y="327.9" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">Yes</text><line data-step="1" x1="177.7" y1="389.0" x2="177.7" y2="412.8" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><polygon data-step="1" points="177.7,412.8 181.9,404.2 173.6,404.2" fill="#1F2937" stroke="#1F2937" stroke-width="1" stroke-linejoin="round"/><line data-step="1" x1="246.7" y1="277.5" x2="315.7" y2="277.5" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><polygon data-step="1" points="315.7,277.5 307.1,273.3 307.1,281.6" fill="#1F2937" stroke="#1F2937" stroke-width="1" stroke-linejoin="round"/><text data-step="2" x="278.6" y="264.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B3ED6" text-anchor=
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="520" height="470" role="img"><title>Flowchart of Euclid's algorithm for the HCF</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="1" points="132.6,20.0 129.0,20.4 125.5,21.4 122.3,23.1 119.5,25.4 117.1,28.3 115.4,31.5 114.4,35.0 114.0,38.6 114.4,42.2 115.4,45.7 117.1,48.9 119.5,51.7 122.3,54.0 125.5,55.7 129.0,56.8 132.6,57.2 222.8,57.2 226.5,56.8 229.9,55.7 233.2,54.0 236.0,51.7 238.3,48.9 240.0,45.7 241.1,42.2 241.4,38.6 241.1,35.0 240.0,31.5 238.3,28.3 236.0,25.4 233.2,23.1 229.9,21.4 226.5,20.4 222.8,20.0" fill="#EDE9FE" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text data-step="1" x="177.7" y="38.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Start</text><polygon data-step="1" points="66.2,131.5 289.2,131.5 289.2,83.7 66.2,83.7" fill="#F5F3FF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text data-step="1" x="177.7" y="98.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Input two numbers a and b</text><text data-step="1" x="177.7" y="116.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">(a is the bigger one)</text><polygon data-step="1" points="66.2,211.1 289.2,211.1 289.2,163.3 66.2,163.3" fill="#F5F3FF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text data-step="1" x="177.7" y="178.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Divide a by b and</text><text data-step="1" x="177.7" y="196.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" d
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180" role="img"><title>Bar model of a 60% mark-up</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="2" points="40.0,70.0 310.0,70.0 310.0,120.0 40.0,120.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><text data-step="2" x="175.0" y="95.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">cost 100% = $35</text><polygon data-step="2" points="310.0,70.0 472.0,70.0 472.0,120.0 310.0,120.0" fill="#A7F3D0" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><text data-step="2" x="391.0" y="95.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">mark-up 60%</text><line data-step="2" x1="40.0" y1="42.0" x2="40.0" y2="52.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="40.0" y1="52.0" x2="472.0" y2="52.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="472.0" y1="52.0" x2="472.0" y2="42.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><text data-step="2" x="256.0" y="38.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">selling price 160% = 35 × 1.6 = $56</text><line data-step="2" x1="310.0" y1="150.0" x2="310.0" y2="140.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="310.0" y1="140.0" x2="472.0" y2="140.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="472.0" y1="140.0" x2="472.0" y2="150.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><text data-step="2" x="391.0" y="156.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">profit $21</text></svg>
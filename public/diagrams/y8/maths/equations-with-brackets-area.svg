<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" width="520" height="290" role="img"><title>Area model for 4(x + 3)</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="1" points="70.0,70.0 300.0,70.0 300.0,220.0 70.0,220.0" fill="#F5F3FF" stroke="#1F2937" stroke-width="2.6" stroke-linejoin="round"/><polygon data-step="1" points="300.0,70.0 410.0,70.0 410.0,220.0 300.0,220.0" fill="#EDE9FE" stroke="#1F2937" stroke-width="2.6" stroke-linejoin="round"/><text data-step="2" x="185.0" y="48.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central" font-style="italic">x</text><text data-step="2" x="355.0" y="48.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">3</text><text data-step="2" x="48.0" y="145.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">4</text><text data-step="3" x="185.0" y="145.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">4 × x = 4x</text><text data-step="3" x="355.0" y="145.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">4 × 3 = 12</text><text data-step="3" x="240.0" y="254.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">4(x + 3) = 4x + 12</text></svg>
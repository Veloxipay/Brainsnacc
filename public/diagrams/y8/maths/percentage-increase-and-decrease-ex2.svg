<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180" role="img"><title>Bar model of a 12% decrease</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="2" points="40.0,70.0 409.6,70.0 409.6,120.0 40.0,120.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><text data-step="2" x="224.8" y="95.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">88% left</text><polygon data-step="1" points="409.6,70.0 460.0,70.0 460.0,120.0 409.6,120.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="6 5"/><text data-step="2" x="434.8" y="95.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">12%</text><line data-step="2" x1="40.0" y1="42.0" x2="40.0" y2="52.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="40.0" y1="52.0" x2="460.0" y2="52.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="460.0" y1="52.0" x2="460.0" y2="42.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><text data-step="2" x="250.0" y="38.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">100% = $650</text><line data-step="2" x1="40.0" y1="150.0" x2="40.0" y2="140.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="40.0" y1="140.0" x2="409.6" y2="140.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="409.6" y1="140.0" x2="409.6" y2="150.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><text data-step="2" x="224.8" y="156.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">88% of $650 = 650 × 0.88 = $572</text><line data-step="2" x1="409.6" y1="150.0" x2="409.6" y2="140.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="409.6" y1="140.0" x2="460.0" y2="140.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="460.0" y1="140.0" x2="460.0" y2="150.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><text data-step="2" x="434.8" y="156.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">off</text></svg>
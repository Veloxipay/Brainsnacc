<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img"><title>Nested brackets</title><rect width="100%" height="100%" fill="#FFFFFF"/><rect data-step="1" x="20.0" y="20.0" width="560.0" height="210.0" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.4"/><text data-step="2" x="34.0" y="42.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#5B3ED6" text-anchor="start" dominant-baseline="central">3rd</text><text data-step="2" x="300.0" y="44.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">−2 × [ … ]   →   −2 × 25 = −50</text><rect data-step="1" x="60.0" y="72.0" width="480.0" height="144.0" rx="14" fill="#F5F3FF" stroke="#1F2937" stroke-width="2.4"/><text data-step="2" x="74.0" y="94.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#5B3ED6" text-anchor="start" dominant-baseline="central">2nd</text><text data-step="2" x="300.0" y="96.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">10 − 3 × ( … )   →   10 + 15 = 25</text><rect data-step="1" x="100.0" y="124.0" width="400.0" height="78.0" rx="14" fill="#EDE9FE" stroke="#5B3ED6" stroke-width="2.4"/><text data-step="2" x="114.0" y="146.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#5B3ED6" text-anchor="start" dominant-baseline="central">1st</text><text data-step="2" x="300.0" y="148.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">2 − 7 = −5</text></svg>
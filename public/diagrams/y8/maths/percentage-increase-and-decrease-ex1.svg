<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180" role="img"><title>Bar model of a 15% increase</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="2" points="40.0,70.0 400.0,70.0 400.0,120.0 40.0,120.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><text data-step="2" x="220.0" y="95.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">100% = $80</text><polygon data-step="2" points="400.0,70.0 454.0,70.0 454.0,120.0 400.0,120.0" fill="#A7F3D0" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><text data-step="2" x="427.0" y="95.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">15%</text><line data-step="2" x1="40.0" y1="42.0" x2="40.0" y2="52.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="40.0" y1="52.0" x2="454.0" y2="52.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="454.0" y1="52.0" x2="454.0" y2="42.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><text data-step="2" x="247.0" y="38.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">115% of $80 = 80 × 1.15 = $92</text><line data-step="2" x1="400.0" y1="150.0" x2="400.0" y2="140.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="400.0" y1="140.0" x2="454.0" y2="140.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="454.0" y1="140.0" x2="454.0" y2="150.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><text data-step="2" x="427.0" y="156.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">+ $12</text></svg>
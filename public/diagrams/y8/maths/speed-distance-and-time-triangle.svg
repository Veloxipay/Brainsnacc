<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" role="img"><title>Distance, speed, time triangle</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="1" points="260.0,30.0 90.0,290.0 430.0,290.0" fill="#F5F3FF" stroke="#1F2937" stroke-width="2.6" stroke-linejoin="round"/><line data-step="1" x1="161.9" y1="180.0" x2="358.1" y2="180.0" stroke="#1F2937" stroke-width="2.6" stroke-linecap="round"/><line data-step="1" x1="260.0" y1="180.0" x2="260.0" y2="290.0" stroke="#1F2937" stroke-width="2.6" stroke-linecap="round"/><text data-step="2" x="260.0" y="123.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">D</text><text data-step="2" x="200.0" y="235.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">S</text><text data-step="2" x="320.0" y="235.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">T</text><text data-step="3" x="380.0" y="60.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start" dominant-baseline="central">D = distance</text><text data-step="3" x="380.0" y="82.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start" dominant-baseline="central">S = speed</text><text data-step="3" x="380.0" y="104.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start" dominant-baseline="central">T = time</text></svg>
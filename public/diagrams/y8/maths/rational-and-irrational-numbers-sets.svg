<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" role="img"><title>Real numbers split into rational and irrational</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="1" points="14.0,14.0 506.0,14.0 506.0,306.0 14.0,306.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><text data-step="1" x="260.0" y="36.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Real numbers</text><polygon data-step="1" points="30.0,58.0 336.0,58.0 336.0,290.0 30.0,290.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><text data-step="1" x="183.0" y="80.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Rational</text><polygon data-step="1" points="48.0,100.0 198.0,100.0 198.0,272.0 48.0,272.0" fill="#EDE9FE" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><text data-step="2" x="123.0" y="122.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Integers</text><text data-step="2" x="123.0" y="156.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">−4</text><text data-step="2" x="123.0" y="186.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">0</text><text data-step="2" x="123.0" y="216.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">7</text><text data-step="2" x="123.0" y="246.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">√16 = 4</text><text data-step="2" x="268.0" y="120.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">3/4</text><text data-step="2" x="268.0" y="154.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">0.75</text><text data-step="2" x="268.0" y="188.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">−1.2</text><text data-step="2" x="268.0" y="222.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">0.333… = 1/3</text><text data-step="2" x="268.0" y="256.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">22/7</text><polygon data-step="1" points="348.0,58.0 490.0,58.0 490.0,290.0 348.0,290.0" fill="#A7F3D0" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><text data-step="1" x="419.0" y="80.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Irrational</text><text data-step="2" x="419.0" y="128.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">√2</text><text data-step="2" x="419.0" y="166.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">√7</text><text data-step="2" x="419.0" y="204.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">π</text><text data-step="2" x="419.0" y="242.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">√30</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="520" height="150" role="img"><title>Scale bar</title><rect width="100%" height="100%" fill="#FFFFFF"/><rect data-step="1" x="50.0" y="70.0" width="120.0" height="16" fill="#1F2937" stroke="#1F2937" stroke-width="2"/><rect data-step="1" x="170.0" y="70.0" width="120.0" height="16" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><rect data-step="1" x="290.0" y="70.0" width="120.0" height="16" fill="#1F2937" stroke="#1F2937" stroke-width="2"/><text data-step="2" x="50.0" y="52.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">0</text><text data-step="2" x="170.0" y="52.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">500</text><text data-step="2" x="290.0" y="52.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">1000</text><text data-step="2" x="410.0" y="52.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">1500 m</text><text data-step="2" x="50.0" y="120.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start" dominant-baseline="central">Each section of the bar is 2 cm long.</text></svg>
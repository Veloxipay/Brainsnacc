<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 175" width="520" height="175" role="img"><title>An hour bar</title><rect width="100%" height="100%" fill="#FFFFFF"/><polygon data-step="1" points="40.0,80.0 480.0,80.0 480.0,130.0 40.0,130.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><polygon data-step="2" points="40.0,80.0 370.0,80.0 370.0,130.0 40.0,130.0" fill="#C4B5FD" stroke="#1F2937" stroke-width="0" stroke-linejoin="round"/><polygon data-step="1" points="40.0,80.0 480.0,80.0 480.0,130.0 40.0,130.0" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round"/><line data-step="1" x1="150.0" y1="80.0" x2="150.0" y2="130.0" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><line data-step="1" x1="260.0" y1="80.0" x2="260.0" y2="130.0" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><line data-step="1" x1="370.0" y1="80.0" x2="370.0" y2="130.0" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round"/><text data-step="1" x="40.0" y="152.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle" dominant-baseline="central">0 min</text><text data-step="1" x="150.0" y="152.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle" dominant-baseline="central">15 min</text><text data-step="1" x="260.0" y="152.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle" dominant-baseline="central">30 min</text><text data-step="1" x="370.0" y="152.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle" dominant-baseline="central">45 min</text><text data-step="1" x="480.0" y="152.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle" dominant-baseline="central">60 min</text><line data-step="2" x1="40.0" y1="52.0" x2="40.0" y2="62.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="40.0" y1="62.0" x2="370.0" y2="62.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><line data-step="2" x1="370.0" y1="62.0" x2="370.0" y2="52.0" stroke="#5B3ED6" stroke-width="2" stroke-linecap="round"/><text data-step="2" x="205.0" y="48.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3ED6" text-anchor="middle" dominant-baseline="central">45 minutes</text><text data-step="1" x="260.0" y="18.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">1 hour = 60 minutes</text></svg>
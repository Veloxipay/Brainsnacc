<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="540" height="400" role="img"><title>Flowchart that tests a conjecture</title><rect width="100%" height="100%" fill="#FFFFFF"/><rect data-step="1" x="155.0" y="11.0" width="70.0" height="38.0" rx="19.0" fill="#EDE9FE" stroke="#1F2937" stroke-width="2.2"/><text data-step="1" x="190.0" y="30.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Start</text><rect data-step="1" x="155.0" y="71.0" width="70.0" height="38.0" rx="4" fill="#F5F3FF" stroke="#1F2937" stroke-width="2.2"/><text data-step="1" x="190.0" y="90.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">n = 1</text><rect data-step="1" x="96.2" y="141.0" width="187.6" height="38.0" rx="4" fill="#F5F3FF" stroke="#1F2937" stroke-width="2.2"/><text data-step="1" x="190.0" y="160.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">value = n² − n + 11</text><polygon data-step="1" points="190.0,212.6 264.0,262.0 190.0,311.4 116.0,262.0" fill="#FEF3C7" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text data-step="1" x="190.0" y="252.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">Is value</text><text data-step="1" x="190.0" y="272.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="central">prime?</text><rect data-step="1" x="138.2" y="346.0" width="103.6" height="38.0" rx="4" fill="#F5F3FF" stroke="#1F2937" stroke-width="2.2"/><text data-step="1" x="190.0" y="365.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fil
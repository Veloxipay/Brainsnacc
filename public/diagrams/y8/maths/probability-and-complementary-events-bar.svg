<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="520" height="150" role="img"><title>Probability bar</title><rect width="100%" height="100%" fill="#FFFFFF"/><rect data-step="2" x="40.0" y="50" width="132.0" height="46" fill="#5B3ED6" stroke="#1F2937" stroke-width="2"/><text data-step="2" x="106.0" y="73.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">P(A) = 0.3</text><rect data-step="1" x="172.0" y="50" width="308.0" height="46" fill="#EDE9FE" stroke="#1F2937" stroke-width="2"/><text data-step="2" x="326.0" y="73.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle" dominant-baseline="central">P(not A) = 1 − 0.3 = 0.7</text><text data-step="1" x="40.0" y="118.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle" dominant-baseline="central">0</text><text data-step="1" x="480.0" y="118.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle" dominant-baseline="central">1</text><text data-step="1" x="260.0" y="24.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle" dominant-baseline="central">The whole bar is a probability of 1</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 120" role="img" aria-label="Brainsnacc">
  <g>  <defs>
    <!-- bite taken out of the top-right corner -->
    <mask id="bite-l">
      <rect width="120" height="120" fill="#fff"/>
      <circle cx="105" cy="31" r="12" fill="#000"/>
      <circle cx="114" cy="47" r="10" fill="#000"/>
      <circle cx="94" cy="21" r="8" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#bite-l)">
    <!-- book covers peeking out under the pages -->
    <path d="M60 104 L8 96 L8 34 L14 33 L14 92 L60 99 Z" fill="#1E4FC2"/>
    <path d="M60 104 L112 96 L112 34 L106 33 L106 92 L60 99 Z" fill="#C4620A"/>
    <!-- left page = left half of the brain (bumpy top like brain folds) -->
    <path d="M60 98 L14 91 L14 46
             C14 34 22 26 30 30
             C30 18 44 14 50 22
             C54 16 60 18 60 24 Z" fill="#2F6BEA"/>
    <!-- right page = right half of the brain -->
    <path d="M60 98 L106 91 L106 46
             C106 34 98 26 90 30
             C90 18 76 14 70 22
             C66 16 60 18 60 24 Z" fill="#F08A24"/>
    <!-- brain folds drawn like lines of writing -->
    <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity=".92">
      <path d="M22 50 C28 45 34 53 40 48 C44 45 48 49 52 47"/>
      <path d="M22 64 C28 59 34 67 40 62 C44 59 48 63 52 61"/>
      <path d="M22 78 C28 73 34 81 40 76 C44 73 48 77 52 75"/>
      <path d="M68 47 C72 49 76 45 80 48 C86 53 92 45 98 50"/>
      <path d="M68 61 C72 63 76 59 80 62 C86 67 92 59 98 64"/>
      <path d="M68 75 C72 77 76 73 80 76 C86 81 92 73 98 78"/>
    </g>
    <!-- spine -->
    <path d="M60 24 L60 99" stroke="#14213D" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  </g>
  <!-- crumbs falling from the bite -->
  <g fill="#F08A24">
    <circle cx="114" cy="60" r="3.2"/><circle cx="108" cy="69" r="2.2"/><circle cx="116" cy="72" r="1.8"/>
  </g>
</g>
  <text x="132" y="80" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1" textLength="326" lengthAdjust="spacingAndGlyphs"><tspan fill="#14213D">Brain</tspan><tspan fill="#F08A24">snacc</tspan></text>
</svg>
